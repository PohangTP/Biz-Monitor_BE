services:

  # ── MySQL 데이터베이스 ──────────────────────────
  db:
    image: mysql:8.0
    container_name: pms-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: pms_db
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - pms_mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI 백엔드 ─────────────────────────────
  api:
    build: .
    container_name: pms-api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: mysql+pymysql://root:${DB_ROOT_PASSWORD:-root}@db:3306/pms_db
    volumes:
      - pms_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  # ── 프론트엔드 정적 파일 (nginx) ──────────────
  web:
    image: nginx:alpine
    container_name: pms-web
    restart: unless-stopped
    volumes:
      - .:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    depends_on:
      - api

volumes:
  pms_mysql_data:
  pms_uploads:
